name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Dry-run path for the ClawHub job only (npm publish stays tag-only).
    description: 'ClawHub dry-run validation (no npm publish)'

permissions:
  id-token: write  # Required for OIDC (npm provenance + ClawHub trusted publishing)
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --workspace @privateclaw/protocol
      - run: npm run build --workspace @privateclaw/privateclaw-relay
      - run: npm run build --workspace @privateclaw/privateclaw
      - run: npm run test --workspace @privateclaw/protocol
      - run: npm run test --workspace @privateclaw/privateclaw-relay
      - run: npm run test --workspace @privateclaw/privateclaw
      - name: Check protocol release version
        id: protocol-release
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/privateclaw-protocol/package.json').name")
          package_version=$(node -p "require('./packages/privateclaw-protocol/package.json').version")
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} already exists on npm; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish protocol package
        if: steps.protocol-release.outputs.publish == 'true'
        run: npm publish --workspace @privateclaw/protocol --access public
      - name: Check provider release version
        id: provider-release
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/privateclaw-provider/package.json').name")
          package_version=$(node -p "require('./packages/privateclaw-provider/package.json').version")
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} already exists on npm; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check relay release version
        id: relay-release
        shell: bash
        run: |
          package_name=$(node -p "require('./services/relay-server/package.json').name")
          package_version=$(node -p "require('./services/relay-server/package.json').version")
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} already exists on npm; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish relay package
        if: steps.relay-release.outputs.publish == 'true'
        run: npm publish --workspace @privateclaw/privateclaw-relay --access public
      - name: Publish provider package
        if: steps.provider-release.outputs.publish == 'true'
        run: npm publish --workspace @privateclaw/privateclaw --access public

  # Mirror the provider package to ClawHub. Tag pushes publish for real (the CLI
  # needs a saved token for tag-triggered runs; trusted publishing only covers
  # workflow_dispatch today). Manual dispatches always run as a dry run.
  clawhub:
    name: Publish provider to ClawHub
    needs: publish
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # clawhub records source repo + exact commit

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      # provider imports the workspace protocol package; build it first (same
      # order as the publish job).
      - run: npm run build --workspace @privateclaw/protocol
      - run: npm run build --workspace @privateclaw/privateclaw

      - name: Validate package (Plugin Inspector)
        run: npx clawhub@0.27.0 package validate packages/privateclaw-provider

      - name: Publish to ClawHub
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "${CLAWHUB_TOKEN}" ]; then
              echo "::error::CLAWHUB_TOKEN secret is missing; cannot publish on tag push"
              exit 1
            fi
            npx clawhub@0.27.0 login --token "$CLAWHUB_TOKEN"
            npx clawhub@0.27.0 package publish packages/privateclaw-provider --wait --wait-timeout 1200 --json
          else
            echo "Dry run (workflow_dispatch): no upload, no token needed."
            npx clawhub@0.27.0 package publish packages/privateclaw-provider --dry-run --json
          fi
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
